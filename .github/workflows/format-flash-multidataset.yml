name: format-flash-multidataset

on:
  push:
    branches:
      - work/flash-multidataset
    paths:
      - muscriptor/flash_multidataset.py
      - .github/workflows/format-flash-multidataset.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/flash-multidataset
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff format muscriptor/flash_multidataset.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscriptor/flash_multidataset.py
          git commit -m "Format Flash multidataset module [skip ci]"
          git push origin HEAD:work/flash-multidataset
