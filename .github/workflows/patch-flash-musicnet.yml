name: patch-flash-musicnet

on:
  push:
    branches:
      - work/flash-musicnet
    paths:
      - .github/workflows/patch-flash-musicnet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/flash-musicnet
      - uses: astral-sh/setup-uv@v6
      - name: Wire MusicNet into trainer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('muscriptor/flash_multidataset.py')
          text = path.read_text()

          text = text.replace(
              'This module extends the Bach10-only real-data path with URMP.  URMP provides\n'
              'aligned note annotations for real multi-instrument performances.  Training\n',
              'This module extends the Bach10-only real-data path with URMP and MusicNet.\n'
              'Both provide aligned note annotations for real multi-instrument performances.\n'
              'Training\n',
          )

          text = text.replace(
              '    bach10: str | Path | None,\n'
              '    urmp: str | Path | None,\n'
              ') -> tuple[dict[str, list[TimedPiece]], dict[str, list[TimedPiece]]]:',
              '    bach10: str | Path | None,\n'
              '    urmp: str | Path | None,\n'
              '    musicnet: str | Path | None,\n'
              ') -> tuple[dict[str, list[TimedPiece]], dict[str, list[TimedPiece]]]:',
              1,
          )

          needle = '''        train["URMP"] = urmp_train\n        validation["URMP"] = urmp_validation\n\n    if not train:\n        raise ValueError("provide at least one of --bach10 or --urmp")\n'''
          replacement = '''        train["URMP"] = urmp_train\n        validation["URMP"] = urmp_validation\n\n    if musicnet is not None:\n        from muscriptor.flash_musicnet import load_musicnet\n\n        musicnet_train, musicnet_test = load_musicnet(musicnet)\n        train["MusicNet"] = musicnet_train\n        validation["MusicNet"] = musicnet_test\n\n    if not train:\n        raise ValueError("provide at least one of --bach10, --urmp, or --musicnet")\n'''
          if needle not in text:
              raise SystemExit('URMP split insertion point not found')
          text = text.replace(needle, replacement, 1)

          text = text.replace(
              '    bach10: str | Path | None = None,\n'
              '    urmp: str | Path | None = None,\n'
              '    metrics_path: str | Path | None = None,',
              '    bach10: str | Path | None = None,\n'
              '    urmp: str | Path | None = None,\n'
              '    musicnet: str | Path | None = None,\n'
              '    metrics_path: str | Path | None = None,',
              1,
          )

          text = text.replace(
              '    train_sets, validation_sets = _split_datasets(bach10=bach10, urmp=urmp)',
              '    train_sets, validation_sets = _split_datasets(\n'
              '        bach10=bach10, urmp=urmp, musicnet=musicnet\n'
              '    )',
              1,
          )

          text = text.replace(
              '    parser.add_argument("--bach10")\n'
              '    parser.add_argument("--urmp")\n'
              '    parser.add_argument("--metrics")',
              '    parser.add_argument("--bach10")\n'
              '    parser.add_argument("--urmp")\n'
              '    parser.add_argument("--musicnet")\n'
              '    parser.add_argument("--metrics")',
              1,
          )

          text = text.replace(
              '        bach10=args.bach10,\n'
              '        urmp=args.urmp,\n'
              '        metrics_path=args.metrics,',
              '        bach10=args.bach10,\n'
              '        urmp=args.urmp,\n'
              '        musicnet=args.musicnet,\n'
              '        metrics_path=args.metrics,',
              1,
          )

          path.write_text(text)
          PY
          uvx ruff format muscriptor/flash_multidataset.py muscriptor/flash_musicnet.py tests/test_flash_musicnet.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscriptor/flash_multidataset.py muscriptor/flash_musicnet.py tests/test_flash_musicnet.py
          git commit -m "Integrate MusicNet into Flash multidataset training [skip ci]"
          git push origin HEAD:work/flash-musicnet
