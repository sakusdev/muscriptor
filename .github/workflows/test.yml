name: tests

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev
      - run: uv run pytest -q
      - name: Validate Flash training CLI
        run: uv run muscriptor-flash-train --help
      - name: Validate Flash promotion CLI
        run: uv run muscriptor-flash-promote --help
      - name: Validate Flash comparison CLI
        run: uv run muscriptor-flash-compare --help
      - name: Validate Flash pipeline CLI
        run: uv run muscriptor-flash-pipeline --help
      - name: Validate Flash training Colab notebook
        run: python -m json.tool notebooks/MuScriptor_Flash_Training_Colab.ipynb > /dev/null
      - name: Ruff check MuScripter Flash code
        run: >-
          uvx ruff check
          muscriptor/flash.py
          muscriptor/flash_cli.py
          muscriptor/flash_colab.py
          muscriptor/flash_neural.py
          muscriptor/flash_realdata.py
          muscriptor/flash_multidataset.py
          muscriptor/flash_musicnet.py
          muscriptor/flash_training_state.py
          muscriptor/flash_train.py
          muscriptor/flash_promote.py
          muscriptor/flash_compare.py
          muscriptor/flash_pipeline.py
          tests/test_flash.py
          tests/test_flash_colab.py
          tests/test_flash_neural.py
          tests/test_flash_realdata.py
          tests/test_flash_multidataset.py
          tests/test_flash_musicnet.py
          tests/test_flash_training_state.py
          tests/test_flash_train.py
          tests/test_flash_promote.py
          tests/test_flash_compare.py
          tests/test_flash_pipeline.py
      - name: Ruff format check MuScripter Flash code
        run: >-
          uvx ruff format --check
          muscriptor/flash.py
          muscriptor/flash_cli.py
          muscriptor/flash_colab.py
          muscriptor/flash_neural.py
          muscriptor/flash_realdata.py
          muscriptor/flash_multidataset.py
          muscriptor/flash_musicnet.py
          muscriptor/flash_training_state.py
          muscriptor/flash_train.py
          muscriptor/flash_promote.py
          muscriptor/flash_compare.py
          muscriptor/flash_pipeline.py
          tests/test_flash.py
          tests/test_flash_colab.py
          tests/test_flash_neural.py
          tests/test_flash_realdata.py
          tests/test_flash_multidataset.py
          tests/test_flash_musicnet.py
          tests/test_flash_training_state.py
          tests/test_flash_train.py
          tests/test_flash_promote.py
          tests/test_flash_compare.py
          tests/test_flash_pipeline.py
