name: tests

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev
      - run: uv run pytest -q
      - id: precommit
        continue-on-error: true
        run: uv run pre-commit run --all-files
      - if: steps.precommit.outcome == 'failure'
        run: git diff -- .
      - if: steps.precommit.outcome == 'failure'
        run: exit 1
