name: wire-flash-resume

on:
  push:
    branches:
      - work/flash-training-resume
    paths:
      - .github/workflows/wire-flash-resume.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/flash-training-resume
      - uses: astral-sh/setup-uv@v6
      - name: Wire resume/autosave into trainer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('muscriptor/flash_multidataset.py')
          text = path.read_text()

          old = 'from muscriptor.flash_realdata import load_bach10\nfrom muscriptor.utils.audio import load_audio\n'
          new = (
              'from muscriptor.flash_realdata import load_bach10\n'
              'from muscriptor.flash_training_state import load_training_state, save_training_state\n'
              'from muscriptor.utils.audio import load_audio\n'
          )
          if old not in text:
              raise SystemExit('import insertion point missing')
          text = text.replace(old, new, 1)

          old = '''    metrics_path: str | Path | None = None,\n    steps: int = 600,\n    batch_size: int = 32,\n    learning_rate: float = 1e-4,\n    real_fraction: float = 0.80,\n    eval_every: int = 50,\n    seed: int = 20261007,\n) -> dict[str, Any]:'''
          new = '''    metrics_path: str | Path | None = None,\n    steps: int = 600,\n    batch_size: int = 32,\n    learning_rate: float = 1e-4,\n    real_fraction: float = 0.80,\n    eval_every: int = 50,\n    seed: int = 20261007,\n    resume_state: str | Path | None = None,\n    state_output: str | Path | None = None,\n    save_every: int = 50,\n) -> dict[str, Any]:'''
          if old not in text:
              raise SystemExit('signature insertion point missing')
          text = text.replace(old, new, 1)

          old = '''    if steps <= 0 or batch_size <= 0:\n        raise ValueError("steps and batch_size must be positive")\n    if not 0.0 < real_fraction <= 1.0:\n        raise ValueError("real_fraction must be in (0, 1]")\n'''
          new = '''    if steps <= 0 or batch_size <= 0:\n        raise ValueError("steps and batch_size must be positive")\n    if eval_every <= 0 or save_every <= 0:\n        raise ValueError("eval_every and save_every must be positive")\n    if not 0.0 < real_fraction <= 1.0:\n        raise ValueError("real_fraction must be in (0, 1]")\n'''
          if old not in text:
              raise SystemExit('validation insertion point missing')
          text = text.replace(old, new, 1)

          start = text.index('    model = FlashNeuralNet(window_samples=_WINDOW_SAMPLES)\n')
          end = text.index('    model.train()\n    for step in range(1, steps + 1):\n', start)
          replacement = '''    model = FlashNeuralNet(window_samples=_WINDOW_SAMPLES)\n    model.load_state_dict(payload["model"])\n    optimizer = torch.optim.AdamW(\n        model.parameters(), lr=learning_rate, weight_decay=2e-4\n    )\n    criterion = nn.BCEWithLogitsLoss(pos_weight=torch.full((88,), 20.0))\n    real_count = max(1, round(batch_size * real_fraction))\n    synth_count = batch_size - real_count\n\n    training_config: dict[str, Any] = {\n        "datasets": sorted(train_sets),\n        "train_piece_names": {\n            name: [piece.name for piece in pieces]\n            for name, pieces in sorted(train_sets.items())\n        },\n        "validation_piece_names": {\n            name: [piece.name for piece in pieces]\n            for name, pieces in sorted(validation_sets.items())\n        },\n        "base_backend": metadata.get("backend"),\n        "batch_size": batch_size,\n        "learning_rate": learning_rate,\n        "real_fraction": real_fraction,\n        "eval_every": eval_every,\n        "seed": seed,\n    }\n    effective_state_path = Path(state_output or resume_state) if (state_output or resume_state) else None\n\n    start_step = 0\n    if resume_state is not None:\n        saved = load_training_state(\n            resume_state,\n            model=model,\n            optimizer=optimizer,\n            rng=rng,\n            np_rng=np_rng,\n            expected_config=training_config,\n        )\n        start_step = int(saved["step"])\n        if start_step > steps:\n            raise ValueError(\n                f"resume state is already at step {start_step}, beyond requested {steps}"\n            )\n        baseline_threshold = float(saved["baseline_threshold"])\n        baseline_metrics = dict(saved["baseline_metrics"])\n        baseline_per_dataset = copy.deepcopy(saved["baseline_per_dataset"])\n        best_f1 = float(saved["best_f1"])\n        best_threshold = float(saved["best_threshold"])\n        best_metrics = dict(saved["best_metrics"])\n        best_per_dataset = copy.deepcopy(saved["best_per_dataset"])\n        best_state = copy.deepcopy(saved["best_state"])\n        best_step = int(saved["best_step"])\n        last_loss = float(saved["last_loss"])\n        print(\n            f"resumed Flash training at step {start_step}/{steps} from {resume_state}",\n            flush=True,\n        )\n    else:\n        baseline_threshold, baseline_metrics, baseline_per_dataset = _evaluate(\n            model, validation_sets\n        )\n        print(\n            "baseline holdout: "\n            f"f1={baseline_metrics['f1']:.4f} "\n            f"p={baseline_metrics['precision']:.4f} "\n            f"r={baseline_metrics['recall']:.4f} "\n            f"threshold={baseline_threshold:.3f}",\n            flush=True,\n        )\n        best_f1 = baseline_metrics["f1"]\n        best_threshold = baseline_threshold\n        best_metrics = dict(baseline_metrics)\n        best_per_dataset = copy.deepcopy(baseline_per_dataset)\n        best_state = copy.deepcopy(model.state_dict())\n        best_step = 0\n        last_loss = 0.0\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '    model.train()\n    for step in range(1, steps + 1):\n',
              '    model.train()\n    for step in range(start_step + 1, steps + 1):\n',
              1,
          )

          marker = '''            model.train()\n\n    model.load_state_dict(best_state)\n'''
          replacement = '''            model.train()\n\n        if effective_state_path is not None and (\n            step % save_every == 0 or step == steps\n        ):\n            save_training_state(\n                effective_state_path,\n                model=model,\n                optimizer=optimizer,\n                step=step,\n                best_state=best_state,\n                best_step=best_step,\n                best_f1=best_f1,\n                best_threshold=best_threshold,\n                best_metrics=best_metrics,\n                best_per_dataset=best_per_dataset,\n                baseline_threshold=baseline_threshold,\n                baseline_metrics=baseline_metrics,\n                baseline_per_dataset=baseline_per_dataset,\n                last_loss=last_loss,\n                rng=rng,\n                np_rng=np_rng,\n                config=training_config,\n            )\n            print(\n                f"saved resumable Flash state at step {step}: {effective_state_path}",\n                flush=True,\n            )\n\n    model.load_state_dict(best_state)\n'''
          if marker not in text:
              raise SystemExit('autosave insertion point missing')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              '        "steps": steps,\n        "best_step": best_step,',
              '        "steps": steps,\n        "resumed_from_step": start_step,\n        "best_step": best_step,',
              1,
          )

          old = '''    parser.add_argument("--eval-every", type=int, default=50)\n    parser.add_argument("--seed", type=int, default=20261007)\n'''
          new = '''    parser.add_argument("--eval-every", type=int, default=50)\n    parser.add_argument("--seed", type=int, default=20261007)\n    parser.add_argument("--resume-state")\n    parser.add_argument("--state-output")\n    parser.add_argument("--save-every", type=int, default=50)\n'''
          if old not in text:
              raise SystemExit('CLI args insertion point missing')
          text = text.replace(old, new, 1)

          old = '''        eval_every=args.eval_every,\n        seed=args.seed,\n    )\n'''
          new = '''        eval_every=args.eval_every,\n        seed=args.seed,\n        resume_state=args.resume_state,\n        state_output=args.state_output,\n        save_every=args.save_every,\n    )\n'''
          if old not in text:
              raise SystemExit('CLI call insertion point missing')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          uvx ruff format muscriptor/flash_multidataset.py muscriptor/flash_training_state.py tests/test_flash_training_state.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscriptor/flash_multidataset.py muscriptor/flash_training_state.py tests/test_flash_training_state.py
          git commit -m "Add resume and autosave to Flash training [skip ci]"
          git push origin HEAD:work/flash-training-resume
