name: wire-lazy-musicnet

on:
  push:
    branches:
      - work/flash-musicnet
    paths:
      - .github/workflows/wire-lazy-musicnet.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/flash-musicnet
      - uses: astral-sh/setup-uv@v6
      - name: Add lazy window support
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('muscriptor/flash_multidataset.py')
          text = path.read_text()

          text = text.replace(
              'import random\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any\n',
              'import random\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Any\n',
              1,
          )

          text = text.replace(
              '    audio: torch.Tensor\n'
              '    labels: torch.Tensor\n'
              '    frame_origin_seconds: float\n'
              '    frame_hop_seconds: float\n',
              '    audio: torch.Tensor | None\n'
              '    labels: torch.Tensor\n'
              '    frame_origin_seconds: float\n'
              '    frame_hop_seconds: float\n'
              '    window_loader: Callable[[float], torch.Tensor] | None = None\n',
              1,
          )

          needle = '''    target_seconds = piece.frame_origin_seconds + frame_index * piece.frame_hop_seconds\n    end = round(target_seconds * _SAMPLE_RATE)\n    start = end - _WINDOW_SAMPLES\n\n    if start >= 0:\n'''
          replacement = '''    target_seconds = piece.frame_origin_seconds + frame_index * piece.frame_hop_seconds\n    if piece.window_loader is not None:\n        frame = piece.window_loader(target_seconds).reshape(-1)\n        if frame.numel() < _WINDOW_SAMPLES:\n            frame = torch.nn.functional.pad(\n                frame, (_WINDOW_SAMPLES - frame.numel(), 0)\n            )\n        elif frame.numel() > _WINDOW_SAMPLES:\n            frame = frame[-_WINDOW_SAMPLES:]\n        return frame.contiguous()\n    if piece.audio is None:\n        raise ValueError(f"{piece.dataset}/{piece.name} has no audio source")\n\n    end = round(target_seconds * _SAMPLE_RATE)\n    start = end - _WINDOW_SAMPLES\n\n    if start >= 0:\n'''
          if needle not in text:
              raise SystemExit('causal window insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          uvx ruff format muscriptor/flash_multidataset.py muscriptor/flash_musicnet.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscriptor/flash_multidataset.py muscriptor/flash_musicnet.py
          git commit -m "Support lazy audio windows in Flash training [skip ci]"
          git push origin HEAD:work/flash-musicnet
